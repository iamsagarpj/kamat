# Netlify configuration: Kamesh Kamble website
# The site is a static export (next.config.mjs: output: 'export'), so Netlify
# just builds it and serves the `out` folder. No server functions are needed.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Static export: don't let Netlify's Next.js runtime plugin take over the build
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Set these two in Netlify > Site configuration > Environment variables:
  #   NEXT_PUBLIC_SITE_URL       e.g. https://www.kameshkamble.in  (no trailing slash)
  #   NEXT_PUBLIC_WEB3FORMS_KEY  your Web3Forms access key (contact form)

# Long-term caching for fingerprinted build assets and self-hosted fonts
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Unknown URLs show the site's own 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
